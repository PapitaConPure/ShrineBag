[config]
schemaVerison = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "PapitaConPure"
name = "ShrineBag"
description = "Configurable finite shuffled bag implementation for Shrines of Chance."
websiteUrl = "https://github.com/PapitaConPure/ShrineBag"
containsNsfwContent = false

[package.dependencies]
bbepis-BepInExPack = "5.4.2113"

[build]
icon = "icons/roo-icon-static.png"
readme = "../README.md"
outdir = "../dist"

[[build.copy]]
source = "../src/bin/Release/netstandard2.1/ShrineBag.dll"
target = "plugins/ShrineBag/"

[[build.copy]]
source = "../src/bin/Release/netstandard2.1/ShrineBag.pdb"
target = "plugins/ShrineBag/"

[[build.copy]]
source = "../CHANGELOG.md"
target = "/"

[publish]
communities = [ "riskofrain2" ]

[publish.categories]
riskofrain2 = [ "server-side", "tweaks" ]